<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;background:#09090b;color:#d4d4d8;font-family:var(--font-body);-webkit-font-smoothing:antialiased}
.wrap{padding:20px;width:700px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.eyebrow{font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:0.15em;color:#71717a;margin-bottom:8px}
.grid{display:grid;gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:9999px;padding:4px 12px;font-size:12px;font-weight:500;border:1px solid transparent}
.card{background:rgba(24,24,27,0.5);border:1px solid #27272a;border-radius:16px;padding:16px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:12px;font-size:14px;font-weight:600;border:1px solid transparent;cursor:pointer;font-family:inherit}
.mono{font-family:var(--font-mono);font-size:11px;color:#71717a}
.sw{border-radius:12px;border:1px solid #27272a}
img.terp{mix-blend-mode:screen}
.wordmark{font-family:'Montserrat',sans-serif;font-weight:800;letter-spacing:-0.01em;font-size:24px;line-height:1}
</style></head><body><div class="wrap">
<div class="eyebrow">Brand accents — the tri-color</div>
<div style="display:flex;gap:12px">

<div style="flex:1;background:#18181b;border:1px solid #27272a;border-radius:16px;padding:14px">
  <div class="sw" style="height:64px;background:#34d399;border-radius:12px"></div>
  <div style="font-weight:700;color:#f4f4f5;margin-top:10px;font-size:14px">Canna</div>
  <div class="mono" style="color:#34d399;margin-top:2px">#34d399</div>
  <div class="mono" style="color:#52525b;margin-top:2px">emerald-400</div>
  <div style="font-size:11px;color:#71717a;margin-top:6px">CTAs · hybrid · verified</div>
</div>
<div style="flex:1;background:#18181b;border:1px solid #27272a;border-radius:16px;padding:14px">
  <div class="sw" style="height:64px;background:#c084fc;border-radius:12px"></div>
  <div style="font-weight:700;color:#f4f4f5;margin-top:10px;font-size:14px">Base</div>
  <div class="mono" style="color:#c084fc;margin-top:2px">#c084fc</div>
  <div class="mono" style="color:#52525b;margin-top:2px">purple-400</div>
  <div style="font-size:11px;color:#71717a;margin-top:6px">wishlist · indica · edibles</div>
</div>
<div style="flex:1;background:#18181b;border:1px solid #27272a;border-radius:16px;padding:14px">
  <div class="sw" style="height:64px;background:#fde047;border-radius:12px"></div>
  <div style="font-weight:700;color:#f4f4f5;margin-top:10px;font-size:14px">AI</div>
  <div class="mono" style="color:#fde047;margin-top:2px">#fde047</div>
  <div class="mono" style="color:#52525b;margin-top:2px">yellow-300</div>
  <div style="font-size:11px;color:#71717a;margin-top:6px">StrainAI · sativa · ratings</div>
</div>
</div></div></body></html>
