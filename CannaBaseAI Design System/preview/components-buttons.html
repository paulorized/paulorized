<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;background:#09090b;color:#d4d4d8;font-family:var(--font-body);-webkit-font-smoothing:antialiased}
.wrap{padding:20px;width:700px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.eyebrow{font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:0.15em;color:#71717a;margin-bottom:8px}
.grid{display:grid;gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:9999px;padding:4px 12px;font-size:12px;font-weight:500;border:1px solid transparent}
.card{background:rgba(24,24,27,0.5);border:1px solid #27272a;border-radius:16px;padding:16px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:12px;font-size:14px;font-weight:600;border:1px solid transparent;cursor:pointer;font-family:inherit}
.mono{font-family:var(--font-mono);font-size:11px;color:#71717a}
.sw{border-radius:12px;border:1px solid #27272a}
img.terp{mix-blend-mode:screen}
.wordmark{font-family:'Montserrat',sans-serif;font-weight:800;letter-spacing:-0.01em;font-size:24px;line-height:1}
</style></head><body><div class="wrap">
<div class="eyebrow">Buttons</div>
<div style="display:flex;flex-direction:column;gap:14px;margin-top:12px">
  <div style="display:flex;gap:10px;align-items:center">
    <button class="btn" style="background:#34d399;color:#09090b">Save review</button>
    <button class="btn" style="background:#34d399;color:#09090b;opacity:0.9">Create account</button>
    <div class="mono" style="color:#71717a">primary · bg-emerald-400 → hover:emerald-300</div>
  </div>
  <div style="display:flex;gap:10px;align-items:center">
    <button class="btn" style="background:#27272a;color:#d4d4d8;border-color:#3f3f46">Load more</button>
    <button class="btn" style="background:rgba(168,85,247,0.1);color:#c084fc;border-color:rgba(168,85,247,0.4)">View Wishlist</button>
    <div class="mono" style="color:#71717a">secondary</div>
  </div>
  <div style="display:flex;gap:10px;align-items:center">
    <button class="btn" style="background:#3f3f46;color:#a1a1aa;cursor:not-allowed;opacity:0.5">Saving…</button>
    <div class="mono" style="color:#71717a">disabled · disabled:opacity-50</div>
  </div>
</div></div></body></html>
