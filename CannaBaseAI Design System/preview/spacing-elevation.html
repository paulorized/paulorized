<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;background:#09090b;color:#d4d4d8;font-family:var(--font-body);-webkit-font-smoothing:antialiased}
.wrap{padding:20px;width:700px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.eyebrow{font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:0.15em;color:#71717a;margin-bottom:8px}
.grid{display:grid;gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:9999px;padding:4px 12px;font-size:12px;font-weight:500;border:1px solid transparent}
.card{background:rgba(24,24,27,0.5);border:1px solid #27272a;border-radius:16px;padding:16px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:12px;font-size:14px;font-weight:600;border:1px solid transparent;cursor:pointer;font-family:inherit}
.mono{font-family:var(--font-mono);font-size:11px;color:#71717a}
.sw{border-radius:12px;border:1px solid #27272a}
img.terp{mix-blend-mode:screen}
.wordmark{font-family:'Montserrat',sans-serif;font-weight:800;letter-spacing:-0.01em;font-size:24px;line-height:1}
</style></head><body><div class="wrap">
<div class="eyebrow">Elevation · borders over shadows</div>
<div style="display:flex;gap:14px;margin-top:12px">
  <div style="flex:1;background:rgba(24,24,27,0.5);border:1px solid #27272a;border-radius:16px;padding:20px;min-height:90px">
    <div style="font-weight:600;font-size:12px;color:#e4e4e7">Rest · card</div>
    <div class="mono" style="margin-top:6px">border-zinc-800<br>bg-zinc-900/50</div>
  </div>
  <div style="flex:1;background:#18181b;border:1px solid #3f3f46;border-radius:16px;padding:20px;min-height:90px">
    <div style="font-weight:600;font-size:12px;color:#e4e4e7">Hover</div>
    <div class="mono" style="margin-top:6px">border-zinc-700<br>bg-zinc-900</div>
  </div>
  <div style="flex:1;background:#18181b;border:1px solid rgba(52,211,153,0.4);border-radius:16px;padding:20px;min-height:90px">
    <div style="font-weight:600;font-size:12px;color:#6ee7b7">Accent hover</div>
    <div class="mono" style="margin-top:6px;color:#34d399">border-emerald-500/40</div>
  </div>
  <div style="flex:1;background:#18181b;border:1px solid #3f3f46;border-radius:16px;padding:20px;min-height:90px;box-shadow:0 20px 25px -5px rgba(0,0,0,0.5)">
    <div style="font-weight:600;font-size:12px;color:#e4e4e7">Dropdown</div>
    <div class="mono" style="margin-top:6px">shadow-xl</div>
  </div>
</div></div></body></html>
