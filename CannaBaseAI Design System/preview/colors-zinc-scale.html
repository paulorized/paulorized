<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;background:#09090b;color:#d4d4d8;font-family:var(--font-body);-webkit-font-smoothing:antialiased}
.wrap{padding:20px;width:700px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.eyebrow{font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:0.15em;color:#71717a;margin-bottom:8px}
.grid{display:grid;gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:9999px;padding:4px 12px;font-size:12px;font-weight:500;border:1px solid transparent}
.card{background:rgba(24,24,27,0.5);border:1px solid #27272a;border-radius:16px;padding:16px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:12px;font-size:14px;font-weight:600;border:1px solid transparent;cursor:pointer;font-family:inherit}
.mono{font-family:var(--font-mono);font-size:11px;color:#71717a}
.sw{border-radius:12px;border:1px solid #27272a}
img.terp{mix-blend-mode:screen}
.wordmark{font-family:'Montserrat',sans-serif;font-weight:800;letter-spacing:-0.01em;font-size:24px;line-height:1}
</style></head><body><div class="wrap">
<div class="eyebrow">Zinc surface scale</div>
<div style="display:grid;grid-template-columns:repeat(9,1fr);gap:8px">
<div><div class="sw" style="height:72px;background:#09090b"></div><div class="mono" style="margin-top:6px">950</div><div class="mono" style="color:#52525b;font-size:10px">page bg</div></div><div><div class="sw" style="height:72px;background:#18181b"></div><div class="mono" style="margin-top:6px">900</div><div class="mono" style="color:#52525b;font-size:10px">card</div></div><div><div class="sw" style="height:72px;background:#27272a"></div><div class="mono" style="margin-top:6px">800</div><div class="mono" style="color:#52525b;font-size:10px">input · border</div></div><div><div class="sw" style="height:72px;background:#3f3f46"></div><div class="mono" style="margin-top:6px">700</div><div class="mono" style="color:#52525b;font-size:10px">subtle · hover</div></div><div><div class="sw" style="height:72px;background:#52525b"></div><div class="mono" style="margin-top:6px">600</div><div class="mono" style="color:#52525b;font-size:10px">muted</div></div><div><div class="sw" style="height:72px;background:#71717a"></div><div class="mono" style="margin-top:6px">500</div><div class="mono" style="color:#52525b;font-size:10px">meta</div></div><div><div class="sw" style="height:72px;background:#a1a1aa"></div><div class="mono" style="margin-top:6px">400</div><div class="mono" style="color:#52525b;font-size:10px">secondary fg</div></div><div><div class="sw" style="height:72px;background:#d4d4d8"></div><div class="mono" style="margin-top:6px">300</div><div class="mono" style="color:#52525b;font-size:10px">primary fg</div></div><div><div class="sw" style="height:72px;background:#f4f4f5"></div><div class="mono" style="margin-top:6px">100</div><div class="mono" style="color:#52525b;font-size:10px">headlines</div></div>
</div></div></body></html>
