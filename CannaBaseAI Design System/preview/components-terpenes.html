<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;background:#09090b;color:#d4d4d8;font-family:var(--font-body);-webkit-font-smoothing:antialiased}
.wrap{padding:20px;width:700px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.eyebrow{font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:0.15em;color:#71717a;margin-bottom:8px}
.grid{display:grid;gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:9999px;padding:4px 12px;font-size:12px;font-weight:500;border:1px solid transparent}
.card{background:rgba(24,24,27,0.5);border:1px solid #27272a;border-radius:16px;padding:16px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:12px;font-size:14px;font-weight:600;border:1px solid transparent;cursor:pointer;font-family:inherit}
.mono{font-family:var(--font-mono);font-size:11px;color:#71717a}
.sw{border-radius:12px;border:1px solid #27272a}
img.terp{mix-blend-mode:screen}
.wordmark{font-family:'Montserrat',sans-serif;font-weight:800;letter-spacing:-0.01em;font-size:24px;line-height:1}
</style></head><body><div class="wrap">
<div class="eyebrow">Terpene chips</div>
<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px">
<span class="chip" style="padding:6px 12px;border-color:rgba(251,191,36,0.3);background:rgba(251,191,36,0.15);color:#fbbf24">
  <img class="terp" src="../assets/icons/terpene-myrcene.png" width="16" height="16">
  <span style="font-weight:600;text-transform:capitalize">myrcene</span>
</span><span class="chip" style="padding:6px 12px;border-color:rgba(250,204,21,0.3);background:rgba(250,204,21,0.15);color:#facc15">
  <img class="terp" src="../assets/icons/terpene-limonene.png" width="16" height="16">
  <span style="font-weight:600;text-transform:capitalize">limonene</span>
</span><span class="chip" style="padding:6px 12px;border-color:rgba(251,146,60,0.3);background:rgba(251,146,60,0.15);color:#fb923c">
  <img class="terp" src="../assets/icons/terpene-caryophyllene.png" width="16" height="16">
  <span style="font-weight:600;text-transform:capitalize">caryophyllene</span>
</span><span class="chip" style="padding:6px 12px;border-color:rgba(192,132,252,0.3);background:rgba(192,132,252,0.15);color:#c084fc">
  <img class="terp" src="../assets/icons/terpene-linalool.png" width="16" height="16">
  <span style="font-weight:600;text-transform:capitalize">linalool</span>
</span><span class="chip" style="padding:6px 12px;border-color:rgba(52,211,153,0.3);background:rgba(52,211,153,0.15);color:#34d399">
  <img class="terp" src="../assets/icons/terpene-pinene.png" width="16" height="16">
  <span style="font-weight:600;text-transform:capitalize">pinene</span>
</span>
</div>
<div class="eyebrow" style="margin-top:18px">Terpene bar row (Stats panel)</div>
<div style="margin-top:8px;display:flex;flex-direction:column;gap:10px">

<div style="display:flex;align-items:center;gap:10px">
  <img class="terp" src="../assets/icons/terpene-myrcene.png" width="18" height="18">
  <div style="flex:1">
    <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px"><span style="color:#fbbf24;font-weight:600">Myrcene</span><span style="color:#fbbf24;opacity:0.7">Relaxing</span></div>
    <div style="height:6px;border-radius:9999px;background:#27272a;overflow:hidden"><div style="height:100%;width:88%;background:#fbbf24"></div></div>
  </div>
</div>
<div style="display:flex;align-items:center;gap:10px">
  <img class="terp" src="../assets/icons/terpene-limonene.png" width="18" height="18">
  <div style="flex:1">
    <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px"><span style="color:#facc15;font-weight:600">Limonene</span><span style="color:#facc15;opacity:0.7">Uplifting</span></div>
    <div style="height:6px;border-radius:9999px;background:#27272a;overflow:hidden"><div style="height:100%;width:62%;background:#facc15"></div></div>
  </div>
</div>
<div style="display:flex;align-items:center;gap:10px">
  <img class="terp" src="../assets/icons/terpene-pinene.png" width="18" height="18">
  <div style="flex:1">
    <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px"><span style="color:#34d399;font-weight:600">Pinene</span><span style="color:#34d399;opacity:0.7">Alertness</span></div>
    <div style="height:6px;border-radius:9999px;background:#27272a;overflow:hidden"><div style="height:100%;width:45%;background:#34d399"></div></div>
  </div>
</div>
</div></div></body></html>
