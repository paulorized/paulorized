<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;background:#09090b;color:#d4d4d8;font-family:var(--font-body);-webkit-font-smoothing:antialiased}
.wrap{padding:20px;width:700px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.eyebrow{font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:0.15em;color:#71717a;margin-bottom:8px}
.grid{display:grid;gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:9999px;padding:4px 12px;font-size:12px;font-weight:500;border:1px solid transparent}
.card{background:rgba(24,24,27,0.5);border:1px solid #27272a;border-radius:16px;padding:16px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:12px;font-size:14px;font-weight:600;border:1px solid transparent;cursor:pointer;font-family:inherit}
.mono{font-family:var(--font-mono);font-size:11px;color:#71717a}
.sw{border-radius:12px;border:1px solid #27272a}
img.terp{mix-blend-mode:screen}
.wordmark{font-family:'Montserrat',sans-serif;font-weight:800;letter-spacing:-0.01em;font-size:24px;line-height:1}
</style></head><body><div class="wrap">
<div class="eyebrow">Verified &amp; AI-estimate badges</div>
<div style="display:flex;flex-direction:column;gap:10px;margin-top:10px">
  <span class="chip" style="padding:4px 12px;border-color:rgba(16,185,129,0.3);background:rgba(16,185,129,0.1);color:#34d399;width:fit-content">
    <span style="display:inline-block;width:6px;height:6px;border-radius:9999px;background:#10b981"></span>
    Verified by Leafly
  </span>
  <span class="chip" style="padding:4px 12px;border-color:rgba(245,158,11,0.3);background:rgba(245,158,11,0.1);color:#fbbf24;width:fit-content">
    ⚠️ AI Estimate — may not be exact
  </span>
  <span class="chip" style="padding:4px 12px;border-color:rgba(16,185,129,0.3);background:rgba(16,185,129,0.2);color:#6ee7b7;width:fit-content">hybrid</span>
  <span class="chip" style="padding:4px 12px;border-color:rgba(234,179,8,0.3);background:rgba(234,179,8,0.2);color:#fde047;width:fit-content">sativa</span>
  <span class="chip" style="padding:4px 12px;border-color:rgba(168,85,247,0.3);background:rgba(168,85,247,0.2);color:#d8b4fe;width:fit-content">indica</span>
</div></div></body></html>
