<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;background:#09090b;color:#d4d4d8;font-family:var(--font-body);-webkit-font-smoothing:antialiased}
.wrap{padding:20px;width:700px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.eyebrow{font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:0.15em;color:#71717a;margin-bottom:8px}
.grid{display:grid;gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:9999px;padding:4px 12px;font-size:12px;font-weight:500;border:1px solid transparent}
.card{background:rgba(24,24,27,0.5);border:1px solid #27272a;border-radius:16px;padding:16px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:12px;font-size:14px;font-weight:600;border:1px solid transparent;cursor:pointer;font-family:inherit}
.mono{font-family:var(--font-mono);font-size:11px;color:#71717a}
.sw{border-radius:12px;border:1px solid #27272a}
img.terp{mix-blend-mode:screen}
.wordmark{font-family:'Montserrat',sans-serif;font-weight:800;letter-spacing:-0.01em;font-size:24px;line-height:1}
</style></head><body><div class="wrap">
<div class="eyebrow">Strain-type semantic colors</div>
<div style="display:flex;gap:10px">

<div style="flex:1;background:rgba(245,158,11,0.12);border:1px solid rgba(245,158,11,0.3);border-radius:12px;padding:12px">
  <div style="font-weight:700;font-size:14px;color:#f59e0b">Sativa</div>
  <div class="mono" style="margin-top:6px;font-size:10px;color:#71717a">#f59e0b</div>
</div>
<div style="flex:1;background:rgba(139,92,246,0.12);border:1px solid rgba(139,92,246,0.3);border-radius:12px;padding:12px">
  <div style="font-weight:700;font-size:14px;color:#8b5cf6">Indica</div>
  <div class="mono" style="margin-top:6px;font-size:10px;color:#71717a">#8b5cf6</div>
</div>
<div style="flex:1;background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.3);border-radius:12px;padding:12px">
  <div style="font-weight:700;font-size:14px;color:#10b981">Hybrid</div>
  <div class="mono" style="margin-top:6px;font-size:10px;color:#71717a">#10b981</div>
</div>
<div style="flex:1;background:rgba(82,82,91,0.12);border:1px solid rgba(82,82,91,0.3);border-radius:12px;padding:12px">
  <div style="font-weight:700;font-size:14px;color:#a1a1aa">Unknown</div>
  <div class="mono" style="margin-top:6px;font-size:10px;color:#71717a">#52525b</div>
</div>
</div>
<div style="margin-top:16px" class="eyebrow">Tier ranks</div>
<div style="display:flex;gap:16px;font-size:13px">
  <span style="color:#a1a1aa">🌿 Seedling</span>
  <span style="color:#a3e635;font-weight:600">🌱 Grower</span>
  <span style="color:#34d399;font-weight:600">🍃 Connoisseur</span>
  <span style="color:#facc15;font-weight:600">🌳 Legend</span>
</div></div></body></html>
